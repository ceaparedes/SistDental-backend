name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sistdental
          POSTGRES_PASSWORD: sistdental
          POSTGRES_DB: sistdental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sistdental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sistdental:sistdental@localhost:5432/sistdental_test?schema=public
      DATABASE_URL: postgresql://sistdental:sistdental@localhost:5432/sistdental_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
